name: Bug
description: Воспроизводимый дефект
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги, ожидаемый и фактический результат
      description: Укажите commit/браузер. Не вставляйте cookie values, токены или личные данные.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Влияние на демо и проверка исправления
    validations:
      required: true
