name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install -r apps/api/requirements-dev.lock && python -m pip install --no-deps -e apps/api
      - run: ruff check apps/api scripts
      - run: ruff format --check apps/api scripts
      - run: python -m pytest apps/api/tests -q
      - run: python scripts/export-openapi.py && git diff --exit-code -- contracts/openapi.json
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:popup
      - run: npm run contracts:types && git diff --exit-code -- apps/extension/lib/api.generated.ts
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: apps/extension/.output/chrome-mv3/
          if-no-files-found: error
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build containers and smoke HTTP API and extension ZIP (no external APIs)
        run: python scripts/smoke-docker.py --extension-output dist
      - uses: actions/upload-artifact@v4
        with:
          name: docker-chrome-mv3
          path: dist/
          if-no-files-found: error
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check issue link for pull requests
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check-pr-link.py
  ci:
    if: always()
    needs: [backend, extension, process, containers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success"
