name: Project sync
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, assigned, unassigned]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amifooled-project-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Explain missing credentials
        if: env.GH_TOKEN == ''
        run: echo 'Project sync is not enabled. Configure PROJECT_TOKEN as described in docs/GITHUB-SETUP.md. Local project-sync.py still works.' >> "$GITHUB_STEP_SUMMARY"
      # Only trusted default-branch code. NEVER checkout pull_request.head with this secret.
      - uses: actions/checkout@v4
        if: env.GH_TOKEN != ''
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: env.GH_TOKEN != ''
        with:
          python-version: '3.12'
      - name: Reconcile repository metadata
        if: env.GH_TOKEN != ''
        run: python3 scripts/project-sync.py
